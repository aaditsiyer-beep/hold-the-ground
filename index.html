<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold the Ground</title>
<style>
:root{--bg:#12161c;--panel:rgba(20,26,36,.9);--line:#4a5570;--fg:#eef1f6;--muted:#a3adc0;--accent:#ffd24a;--hp:#4fd16b;--keep:#e0a040;--card:#222b3a;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:8px 16px;font-family:system-ui,sans-serif}
#wrap{position:relative;flex:1;min-height:360px;overflow:hidden;border:2px solid var(--line);border-radius:6px;background:#bcd8ee;cursor:crosshair}
#wrap canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;width:min(330px,70%);pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000;color:#fff}
.bar{height:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%}
#hp{background:var(--hp);width:100%}#keep{background:var(--keep);width:100%}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#charge{position:absolute;left:50%;bottom:70px;width:160px;height:8px;margin-left:-80px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:3px;overflow:hidden;opacity:0;pointer-events:none}
#chargeBar{height:100%;width:0}
#msg{position:absolute;left:0;right:0;bottom:90px;text-align:center;color:var(--accent);font-size:17px;text-shadow:0 1px 3px #000;pointer-events:none;padding-inline:12px}
#hurt{position:absolute;inset:0;background:#c00;opacity:0;pointer-events:none;transition:opacity .15s}
#bar{position:absolute;left:0;right:0;bottom:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-inline:8px}
button{background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
#shopMenu{position:absolute;inset:0;background:rgba(8,10,16,.78);display:flex;align-items:center;justify-content:center;padding:12px;cursor:default}
#shopMenu[hidden],#over[hidden]{display:none}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:8px;max-width:760px;width:100%;max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:1.1rem;flex:1}
#shopGold{color:var(--accent);font-variant-numeric:tabular-nums}
#shopBody{overflow-y:auto;padding:4px 14px 14px}
#shopBody h3{margin:14px 0 6px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.god{border-color:#8a7a3a}
.card .t{font-weight:600}.card .d{font-size:12px;color:var(--muted);flex:1}
#over{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#overTitle{margin:0;font-size:3rem}
#help{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head><body>
<div id="wrap">
  <div id="hud"><div class="bar" title="Your health"><div id="hp"></div></div><div class="bar" title="Keep health"><div id="keep"></div></div><div id="stats"></div><div id="goal"></div></div>
  <div id="cross"></div>
  <div id="charge"><div id="chargeBar"></div></div>
  <div id="hurt"></div>
  <div id="msg"></div>
  <div id="bar"><button id="btnShop">Shop (B)</button><button id="btnArmy">Army: Defend (T)</button></div>
  <div id="shopMenu" hidden><div class="panel"><div class="top"><h2>Shop</h2><span id="shopGold"></span><button id="shopClose">Close (B)</button></div><div id="shopBody"></div></div></div>
  <div id="over" hidden><h1 id="overTitle"></h1><div id="overText"></div><button id="again">Play again (R)</button></div>
</div>
<div id="help">Arrow keys move · mouse looks (click to capture, or right-drag) · Q/E turn · Space jump · click: sword combo (slash, backhand, overhead slam) · hold click then release: lunge · F: spin attack · B: shop (pauses) · T: army defend/attack · Destroy every enemy house and the castle to win</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script></body></html>
