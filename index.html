<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold the Ground</title>
<style>
  body{margin:0;background:#1b1f27;color:#e8e8e8;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px}
  canvas{background:#000;border:2px solid #333;max-width:100%;cursor:crosshair}
  #shop{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-width:720px;justify-content:center}
  button{background:#2d3442;color:#e8e8e8;border:2px solid #444;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{background:#3a4356}
  button.sel{border-color:#ffd24a;background:#47401f}
  #help{font-size:12px;color:#9aa;margin-top:8px;max-width:720px;text-align:center}
</style>
</head>
<body>
<canvas id="c" width="720" height="480"></canvas>
<div id="shop"></div>
<div id="help">WASD move · mouse aim · click / Space swing sword · pick a shop item then click a tile to place it · Sword mode = click attacks · Esc = sword · Enter = start wave</div>
<script src="game.js"></script>
</body>
</html>
