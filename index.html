<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hold the Ground</title>
<style>
:root{--bg:#12161c;--panel:rgba(20,26,36,.82);--line:#4a5570;--fg:#eef1f6;--muted:#a3adc0;--accent:#ffd24a;--hp:#4fd16b;--keep:#e0a040;color-scheme:dark}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:8px 16px;font-family:system-ui,sans-serif}
#wrap{position:relative;flex:1;min-height:360px;overflow:hidden;border:2px solid var(--line);border-radius:6px;background:#bcd8ee}
#wrap canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;width:min(260px,60%);pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000}
.bar{height:12px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar>div{height:100%}
#hp{background:var(--hp);width:100%}#keep{background:var(--keep);width:100%}
#msg{position:absolute;left:0;right:0;bottom:64px;text-align:center;color:var(--accent);font-size:17px;text-shadow:0 1px 3px #000;pointer-events:none;padding-inline:12px}
#hurt{position:absolute;inset:0;background:#c00;opacity:0;pointer-events:none;transition:opacity .15s}
#shop{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding-inline:8px}
button{background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#over{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#over[hidden]{display:none}
#overTitle{margin:0;font-size:3rem}
#help{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
</style>
</head><body>
<div id="wrap">
  <div id="hud"><div class="bar" title="Your health"><div id="hp"></div></div><div class="bar" title="Keep health"><div id="keep"></div></div><div id="stats"></div></div>
  <div id="hurt"></div>
  <div id="msg"></div>
  <div id="shop"></div>
  <div id="over" hidden><h1 id="overTitle"></h1><div id="overText"></div><button id="again">Play again (R)</button></div>
</div>
<div id="help">WASD move · Space jump · click or F swings your sword · right-drag or Q/E turns the camera · 1-5 buy: soldiers and archers appear beside you, walls go in front · Enter starts a wave · if you fall you respawn at the keep and your base stays
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script></body></html>
